<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <meta name="theme-color" content="#F6F2EB">
    <meta name="description" content="Contactez la coopérative Thimdrine pour découvrir nos produits du terroir et notre savoir-faire artisanal.">
    <link rel="canonical" href="https://thimdrine.vercel.app/contact">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="Thimdrine">
    <meta property="og:title" content="Contact | Coopérative Thimdrine">
    <meta property="og:description" content="Écrivez à la coopérative Thimdrine pour toute question sur nos produits.">
    <meta property="og:url" content="https://thimdrine.vercel.app/contact">
    <meta property="og:image" content="https://thimdrine.vercel.app/assets/acceuil/bg_hero.webp">
    <title>Contact | Coopérative Thimdrine</title>
    <!-- global css-->
    <link rel="stylesheet" href="../css/global.css">

    <!-- shared css -->
    <link rel="stylesheet" href="../css/components/01-navbar.css">
    <link rel="stylesheet" href="../css/components/02-footer.css">

    <!-- links css -->
    <link rel="stylesheet" href="../css/contact/01-contact.css">
</head>
<body>
    <header>
        <p class="site-name">Thimdrine</p>
        <nav class="links" aria-label="Navigation principale">
            <a class="link" href="/">Accueil</a>
            <a class="link" href="/products">Nos produits</a>
            <a class="link" href="/about">A propos</a>
            <a class="link focused" href="/contact" aria-current="page">Contact</a>
        </nav>
    </header>
    <main>
        <section class="contact">
            <div class="left-container">
                <h2>Contactez-nous</h2>
                <img src="../assets/contact/contact.webp" alt="Portrait d’une femme portant un foulard et des lunettes de soleil, tenant une banane.">
            </div>
            <form class="right-container" aria-labelledby="contact-form-title">
                <h1 id="contact-form-title">Nous écrire</h1>
                <div class="form-fields">
                    <div class="field-row">
                        <div class="field">
                            <label for="nom">Nom</label>
                            <input id="nom" name="nom" type="text" placeholder="Votre nom" autocomplete="family-name" required minlength="2" maxlength="60" pattern="\p{L}+(?:(?: |'|’|-)\p{L}+)*" title="2 à 60 caractères : lettres, espaces, apostrophes ou traits d’union.">
                        </div>
                        <div class="field">
                            <label for="prenom">Prénom</label>
                            <input id="prenom" name="prenom" type="text" placeholder="Votre prénom" autocomplete="given-name" required minlength="2" maxlength="60" pattern="\p{L}+(?:(?: |'|’|-)\p{L}+)*" title="2 à 60 caractères : lettres, espaces, apostrophes ou traits d’union.">
                        </div>
                    </div>
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" placeholder="Votre adresse e-mail" autocomplete="email" required maxlength="254" pattern="[^\s@]+@[^\s@]+\.[^\s@]{2,}" title="Saisissez une adresse e-mail valide.">
                    </div>
                    <div class="field">
                        <label for="objet">Objet</label>
                        <input id="objet" name="objet" type="text" placeholder="Objet de votre message" required minlength="3" maxlength="100" pattern="(?:\p{L}|\p{N})(?:(?:\p{L}|\p{N})| |,|\.|'|’|!|\?|\(|\)|&amp;|:|/|_|\+|-|°)*" title="3 à 100 caractères. Utilisez des lettres, chiffres et une ponctuation simple.">
                    </div>
                    <div class="field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Votre message" required minlength="10" maxlength="2000" pattern="(?=.*[\p{L}\p{N}])[\s\S]*" title="Ajoutez au moins une lettre ou un chiffre à votre message."></textarea>
                    </div>
                </div>
                <button class="submit-button" type="submit">Envoyer le message</button>
            </form>
        </section>
    </main>
    <footer>
        <div class="footer-container">
            <div class="title-conainer">
                <p class="logo">Thimdrine</p>
                <nav class="links" aria-label="Navigation de pied de page">
                    <a class="link" href="/">Accueil</a>
                    <a class="link" href="/products">Nos produits</a>
                    <a class="link" href="/about">A propos</a>
                    <a class="link focused" href="/contact" aria-current="page">Contact</a>
                </nav>
            </div>
            <div class="hr"><hr></div>
            <div class="copywrite">
                <h4>© Thimdrine copywrite 2026</h4>
                <h4>Made with ❤️ by <a href="https://github.com/ahtalbi">Ahmed Talbi</a></h4>
            </div>
        </div>
    </footer>
</body>
</html>
